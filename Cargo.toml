[package]
name = "multiglass"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "multiglass"
path = "src/main.rs"

[dependencies]
shellglass = { git = "https://github.com/mrexodia/shellglass", branch = "disconnect-fix", default-features = false, features = ["mirror", "push-api", "hub"] }
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
